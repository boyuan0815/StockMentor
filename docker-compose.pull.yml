name: ${COMPOSE_PROJECT_NAME:-stockmentor}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stockmentor}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - stockmentor_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/stockmentor-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-stockmentor}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      STOCKMENTOR_ADMIN_TOKEN: ${STOCKMENTOR_ADMIN_TOKEN:?STOCKMENTOR_ADMIN_TOKEN is required}
      STOCKMENTOR_CORS_ALLOWED_ORIGINS: ${STOCKMENTOR_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder-not-used-for-health-demo}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-placeholder-not-used-for-health-demo}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/database >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/stockmentor-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  stockmentor_mysql_data:
